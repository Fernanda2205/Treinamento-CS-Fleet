<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Treinamento de Novos Consultores · Contele Fleet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Archivo:wdth,wght@75..125,500..800&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#F3F5F8; --surface:#FFFFFF; --ink:#132033; --muted:#5B6878; --line:#DFE4EB;
  --side:#0F1B2D; --side-ink:#C9D3E1; --side-muted:#7F8DA3;
  --blue:#2F5BEA; --blue-soft:#E8EEFE;
  --amber:#F2A900; --amber-soft:#FFF5D9; --amber-ink:#7A5400;
  --green:#14855B; --green-soft:#E3F5EC;
  --red:#C53B3B; --red-soft:#FDECEC;
  --violet:#6E46D9; --violet-soft:#EFEAFD;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0B1320; --surface:#132033; --ink:#E8EDF4; --muted:#9AA7B8; --line:#24344B;
    --blue-soft:#1A2B55; --amber-soft:#3A2E0B; --amber-ink:#F7CF66;
    --green-soft:#103426; --red-soft:#3A1717; --violet-soft:#261C46;
  }
}
:root[data-theme="dark"]{
  --bg:#0B1320; --surface:#132033; --ink:#E8EDF4; --muted:#9AA7B8; --line:#24344B;
  --blue-soft:#1A2B55; --amber-soft:#3A2E0B; --amber-ink:#F7CF66;
  --green-soft:#103426; --red-soft:#3A1717; --violet-soft:#261C46;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:400 15px/1.55 "Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif}
h1,h2,h3{font-family:"Archivo","Arial Narrow",system-ui,sans-serif;margin:0;line-height:1.15}
a{color:inherit}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px;border-radius:6px}

.app{display:grid;grid-template-columns:minmax(0,1fr) 300px;height:100%}
main{overflow-y:auto;padding:32px clamp(16px,4vw,48px) 40px}
.wrap{max-width:980px;margin:0 auto}

/* topo */
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:24px}
.top h1{font-size:clamp(24px,3vw,32px);font-weight:800;font-stretch:90%}
.brand-img{height:44px;width:auto;background:#fff;border-radius:10px;padding:6px 10px;flex:none}
.ccert .logo-img{height:clamp(30px,6vw,60px);width:auto;margin-bottom:4%;position:relative;z-index:1}
.brand{font-family:"Archivo",sans-serif;font-weight:800;font-size:22px;color:var(--blue);line-height:1;text-align:right;white-space:nowrap}
.brand small{display:block;font-size:11px;font-weight:700;color:#fff;background:var(--blue);border-radius:3px;padding:2px 6px;margin-top:3px;margin-left:auto;width:max-content}

/* painel */
.panel{display:grid;grid-template-columns:minmax(0,1fr) 220px;gap:20px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:28px}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;margin-bottom:10px}
.card > h2{font-size:24px;font-weight:800;margin-bottom:6px}
.lead{color:var(--muted);max-width:62ch;margin:0 0 22px}
.side-art{border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center}
.side-art .ico{width:88px;height:88px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-size:38px}
.side-art strong{font-family:"Archivo",sans-serif;font-size:17px}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.item{border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:8px;background:var(--surface)}
.item.done{border-color:var(--green)}
.item.wide{grid-column:1/-1}
.lib{border-top:1px solid var(--line);margin-top:8px;padding-top:14px}
.lib h4{font-family:"Archivo",sans-serif;font-size:14.5px;margin:0 0 2px}
.lib .gs{color:var(--muted);font-size:13px;margin:0 0 8px}
.lib > div{margin-bottom:14px}
.item h3{font-size:16px;font-weight:700;font-stretch:95%}
.item p{margin:0;color:var(--muted);font-size:13.5px}
.item .actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:auto;padding-top:6px;align-items:center}
.btn{display:inline-flex;align-items:center;gap:6px;font:600 13px "Public Sans",sans-serif;background:var(--blue);color:#fff;border:0;border-radius:9px;padding:8px 13px;text-decoration:none;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.check{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);cursor:pointer;margin-left:auto}
.check input{accent-color:var(--green);width:16px;height:16px}
.pending{font-size:12.5px;font-weight:600;color:var(--amber-ink);background:var(--amber-soft);border-radius:8px;padding:6px 10px}

.notice{display:flex;gap:14px;align-items:flex-start;background:var(--amber-soft);border:1px dashed var(--amber);border-radius:14px;padding:16px 18px;margin-bottom:18px;color:var(--amber-ink)}
.notice strong{display:block;color:var(--ink)}
.creds{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.cred{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 12px;min-width:0;max-width:100%}
.cred small{display:block;font-size:11px;font-weight:700;color:var(--amber-ink)}
.cred a,.cred code{font:600 13.5px "Public Sans",sans-serif;color:var(--ink);word-break:break-all;user-select:all}
.cred a{color:var(--blue)}
.group{margin-top:26px}
.group:first-of-type{margin-top:0}
.group h3.gt{font-size:17px;font-weight:700;margin-bottom:4px}
.group .gs{color:var(--muted);font-size:13.5px;margin:0 0 12px}
.vids{display:flex;flex-wrap:wrap;gap:8px}
.vid{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:10px;padding:8px 12px;text-decoration:none;font-size:13.5px;font-weight:600;background:var(--surface)}
.vid:hover{border-color:var(--blue)}
.vid.seen{border-color:var(--green);color:var(--green)}
.vid .dot{width:8px;height:8px;border-radius:50%;background:var(--blue)}
.vid.seen .dot{background:var(--green)}

.modules{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px;margin-top:6px}
.mod{border-radius:12px;background:var(--bg);padding:12px 14px;font-size:13.5px}
.mod b{display:block;font-size:14px;margin-bottom:2px}
.mod span{color:var(--muted)}

/* início */
.hero{background:var(--side);color:#fff;border-radius:20px;padding:clamp(24px,4vw,44px);position:relative;overflow:hidden}
.hero h2{font-size:clamp(28px,4.5vw,46px);font-weight:800;font-stretch:85%;max-width:16ch}
.hero p{color:var(--side-ink);max-width:56ch;margin:14px 0 22px}
.hero svg{position:absolute;right:-20px;bottom:-10px;width:min(46%,380px);opacity:.9;pointer-events:none}
.stats{display:flex;flex-wrap:wrap;gap:24px;margin-top:6px}
.stats div{font-size:13px;color:var(--side-muted)}
.stats b{display:block;font-family:"Archivo",sans-serif;font-size:22px;color:#fff}

/* cronologia */
.timeline{list-style:none;margin:0;padding:0;position:relative}
.timeline::before{content:"";position:absolute;left:15px;top:8px;bottom:8px;border-left:3px dashed var(--line)}
.timeline li{position:relative;padding:0 0 22px 48px}
.timeline .pin{position:absolute;left:4px;top:2px;width:25px;height:25px;border-radius:50%;background:var(--surface);border:3px solid var(--blue)}
.timeline .days{font-size:12.5px;font-weight:700;color:var(--blue)}
.timeline h3{font-size:17px;margin:2px 0 4px}
.timeline p{margin:0;color:var(--muted);font-size:14px;max-width:60ch}

/* rodapé navegação */
.pager{display:flex;justify-content:flex-end;align-items:center;gap:12px;margin-top:22px}
.pager .count{color:var(--muted);font-weight:600;font-size:14px;margin-right:6px}
.pager button{font:700 15px "Public Sans",sans-serif;border-radius:12px;padding:12px 22px;cursor:pointer}
.pager .prev{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.pager .next{background:var(--blue);color:#fff;border:0}
.pager button:disabled{opacity:.45;cursor:default}

/* sidebar com rota */
aside{background:var(--side);color:var(--side-ink);display:flex;flex-direction:column;padding:26px 18px 22px;overflow-y:auto}
aside .label{font-size:12px;font-weight:700;color:var(--side-muted);margin:0 10px 12px}
.nav{list-style:none;margin:0 0 22px;padding:0}
.nav button{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:12px;width:100%;padding:11px 12px;border-radius:12px;cursor:pointer;font-weight:600;font-size:15px;color:var(--side-ink)}
.nav button:hover{background:#18273D}
.nav button.active{background:var(--blue);color:#fff}
.route{list-style:none;margin:0;padding:0;position:relative}
.route::before{content:"";position:absolute;left:27px;top:22px;bottom:22px;width:4px;background:repeating-linear-gradient(to bottom,#2A3B55 0 10px,transparent 10px 16px);border-radius:2px}
.route li{position:relative}
.route button{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:14px;width:100%;padding:10px 12px;border-radius:12px;cursor:pointer;font-weight:600;font-size:15px;color:var(--side-ink)}
.route button:hover{background:#18273D}
.route .stop{flex:none;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:#1C2C44;border:2px solid #2E4262;font-size:15px;position:relative;z-index:1}
.route button.active{background:var(--blue);color:#fff}
.route button.active .stop{border-color:#fff}
.route .meta{display:flex;flex-direction:column;line-height:1.25}
.route .meta small{font-weight:500;font-size:12px;color:var(--side-muted)}
.route button.active small{color:#D9E3FF}
.route .stop.full{background:var(--green);border-color:var(--green)}
.progress{margin-top:auto;padding:16px 10px 0;border-top:1px solid #22324A}
.progress .row{display:flex;justify-content:space-between;font-size:13px;font-weight:600;margin-bottom:8px}
.bar{height:6px;background:#22324A;border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--amber);width:0;transition:width .4s}
.reset{all:unset;cursor:pointer;font-size:12px;color:var(--side-muted);margin-top:10px;display:inline-block}
.reset:hover{color:#fff}


.info{font-size:12.5px;font-weight:600;color:var(--blue);background:var(--blue-soft);border-radius:8px;padding:6px 10px}
.info a{color:inherit}
.score{font-size:12.5px;font-weight:700;border-radius:8px;padding:6px 10px}
.score.ok{color:var(--green);background:var(--green-soft)}
.score.no{color:var(--red);background:var(--red-soft)}
.overlay{position:fixed;inset:0;background:rgba(8,14,24,.6);display:none;align-items:flex-start;justify-content:center;padding:calc(env(safe-area-inset-top,0px) + 24px) 16px calc(env(safe-area-inset-bottom,0px) + 24px);overflow-y:auto;z-index:50}
.overlay.open{display:flex}
.modal{background:var(--surface);color:var(--ink);border-radius:18px;width:min(760px,100%);padding:28px;position:relative}
.modal h2{font-size:24px;font-weight:800;margin-bottom:6px}
.modal .x{position:absolute;top:14px;right:14px;background:var(--bg);border:1px solid var(--line);border-radius:10px;width:36px;height:36px;cursor:pointer;font-size:18px;color:var(--ink)}
.q{border:1px solid var(--line);border-radius:14px;padding:16px;margin:14px 0}
.q legend{font-weight:700;padding:0 4px;font-size:15px}
.q label{display:flex;gap:10px;align-items:flex-start;padding:7px 8px;border-radius:8px;cursor:pointer;font-size:14.5px}
.q label:hover{background:var(--bg)}
.q input{accent-color:var(--blue);margin-top:4px}
.q.right{border-color:var(--green)} .q.wrong{border-color:var(--red)}
.q .fb{font-size:13.5px;margin-top:8px;padding:8px 10px;border-radius:8px;display:none}
.q.right .fb{display:block;background:var(--green-soft);color:var(--green)}
.q.wrong .fb{display:block;background:var(--red-soft);color:var(--red)}
.result{border-radius:14px;padding:16px 18px;margin-top:16px;font-weight:600}
.result.ok{background:var(--green-soft);color:var(--green)} .result.no{background:var(--red-soft);color:var(--red)}
.crit{width:100%;border-collapse:collapse;font-size:14px;margin-top:12px}
.crit th,.crit td{border-bottom:1px solid var(--line);padding:10px 8px;text-align:left;vertical-align:top}
.crit th{font-size:12.5px;color:var(--muted)}
.crit input{width:64px;padding:6px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
.tablewrap{overflow-x:auto}
.steps{margin:10px 0 0;padding-left:20px;font-size:14.5px}
.steps li{margin-bottom:6px}
.cert{background:#FFFDF7;color:#1A2333;border:10px solid #0F1B2D;outline:2px solid #F2A900;outline-offset:-18px;border-radius:6px;padding:48px 40px;text-align:center;margin-top:16px;aspect-ratio:1.414/1;display:flex;flex-direction:column;justify-content:center;gap:10px}
.cert .k{font:700 12px "Public Sans",sans-serif;letter-spacing:.2em;color:#7A5400}
.cert h3{font:800 clamp(24px,4vw,40px) "Archivo",sans-serif;font-stretch:85%;color:#0F1B2D}
.cert .nm{font:700 clamp(22px,3.4vw,34px) "Archivo",sans-serif;color:#2F5BEA;border-bottom:2px solid #DCC27A;display:inline-block;padding:0 24px 6px;margin:4px auto}
.cert p{margin:0;font-size:clamp(12px,1.6vw,15px);max-width:56ch;margin-inline:auto}
.cert .sig{display:flex;justify-content:space-around;gap:20px;margin-top:22px;font-size:12px}
.cert .sig div{border-top:1px solid #1A2333;padding-top:6px;min-width:150px}
.certform{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}
.certform input{flex:1 1 200px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit}

.fxchips{display:flex;flex-wrap:wrap;gap:6px;padding-right:40px}
.fxchip{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:var(--surface);color:var(--muted);font:700 13px "Public Sans",sans-serif;cursor:pointer}
.fxchip.ans{color:var(--blue);border-color:var(--blue)}
.fxchip.cur{background:var(--blue);color:#fff;border-color:var(--blue)}
.fxchip:disabled{opacity:.4;cursor:default}
.fxopt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:10px;font:500 15px/1.45 "Public Sans",sans-serif;color:var(--ink);cursor:pointer}
.fxopt:hover{border-color:var(--blue)}
.fxopt .r{flex:none;width:20px;height:20px;border-radius:50%;border:2px solid var(--muted);margin-top:1px}
.fxopt.sel{border-color:var(--blue);background:var(--blue-soft)}
.fxopt.sel .r{border-color:var(--blue);background:radial-gradient(var(--blue) 0 40%,transparent 45%)}
.certscore{display:flex;justify-content:center;gap:40px;background:#F6F4EC;border:1px solid #E8E1C9;border-radius:12px;padding:12px 30px;margin:10px auto 0;width:max-content;max-width:100%}
.certscore small{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#6B7585}
.certscore b{font:800 clamp(22px,3vw,32px) "Archivo",sans-serif;color:#2F5BEA}
.gab{margin-top:18px;border:1px solid var(--line);border-radius:12px;padding:18px}
.gab h3{font-size:18px}
.gabgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px;margin-top:10px}
.gabgrid div{background:var(--bg);border-left:4px solid var(--green);border-radius:6px;padding:10px 12px;font-size:12.5px;display:flex;flex-direction:column;gap:4px}
.gabgrid div.no{border-left-color:var(--red)}
.gabgrid span{color:var(--muted)}

.ccert,.cgab{background:#fff;color:#111;font-family:"Inter","Public Sans",system-ui,sans-serif}
.ccert{position:relative;aspect-ratio:1122/792;border-radius:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:6%;margin-top:14px;box-shadow:0 0 0 1px var(--line)}
.ccert .b1{position:absolute;inset:3.8%;border:2px solid #7b2cbf;border-radius:8px}
.ccert .b2{position:absolute;inset:4.5%;border:1px solid #e0e0e0;border-radius:6px}
.ccert .logo{font:800 clamp(18px,3vw,30px) "Archivo",sans-serif;color:#7b2cbf;margin-bottom:4%;line-height:1}
.ccert .logo span{display:block;font-size:.4em;color:#fff;background:#7b2cbf;border-radius:3px;padding:2px 6px;width:max-content;margin:3px 0 0 auto}
.ccert h3{font:700 clamp(18px,3.6vw,40px) "Archivo",sans-serif;color:#333;text-transform:uppercase;letter-spacing:.06em;margin-bottom:2.5%}
.ccert .txt{font-size:clamp(11px,1.9vw,20px);color:#555;max-width:78%;line-height:1.6;margin:0 0 3.5%}
.ccert .txt strong{color:#7b2cbf}
.ccert .sc{display:flex;align-items:center;gap:clamp(16px,6vw,70px);background:#fafafa;border:1px solid #eee;border-radius:12px;padding:1.6% 5%}
.ccert .sc i{width:2px;align-self:stretch;background:#ddd}
.ccert .sc small{display:block;font-size:clamp(8px,1.2vw,13px);color:#888;text-transform:uppercase;letter-spacing:.06em}
.ccert .sc b{font-size:clamp(18px,3.4vw,40px);color:#7b2cbf}
.ccert .ft{margin-top:4%;display:flex;flex-direction:column;gap:4px;font-size:clamp(10px,1.4vw,16px);color:#222}
.ccert .ft span{color:#999;font-size:.9em}
.cgab{margin-top:16px;border-radius:6px;padding:24px;box-shadow:0 0 0 1px var(--line)}
.cgab h3{font:700 24px "Archivo",sans-serif;color:#7b2cbf;text-align:center}
.cgab > p{text-align:center;color:#666;font-size:13px;margin:4px 0 16px}
.cgab .gg{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.cgab .gg div{background:#f9fafb;border-left:4px solid #10B981;border-radius:6px;padding:10px 14px;font-size:12.5px;display:flex;flex-direction:column;gap:6px}
.cgab .gg div.no{border-left-color:#EF4444}
.cgab .gg b{color:#374151;line-height:1.3}
.cgab .gg span{color:#4b5563;line-height:1.3}
.cgab .gg em{font-style:normal;font-weight:800;color:#10B981}
.cgab .gg div.no em{color:#EF4444}
@media print{
  body *{visibility:hidden}
  #cert-print,#cert-print *{visibility:visible}
  #cert-print{position:absolute;left:0;top:0;width:100%;margin:0}
  #cert-print .ccert{height:100vh;aspect-ratio:auto;margin:0;box-shadow:none;break-after:page}
  #cert-print .cgab{box-shadow:none;margin:0}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  @page{size:A4 landscape;margin:0}
}

.menu-toggle{display:none}
@media (max-width:900px){
  .app{grid-template-columns:1fr;grid-template-rows:auto 1fr}
  aside{order:-1;padding:12px 14px;max-height:none}
  aside .label,.progress .reset{display:none}
  .nav,.route{display:flex;gap:6px;overflow-x:auto;margin:0;padding-bottom:4px}
  .nav button,.route button{width:auto;white-space:nowrap;padding:8px 10px;font-size:14px}
  .route::before{display:none}
  .route .meta small{display:none}
  .route .stop{width:26px;height:26px;font-size:13px}
  aside > div.navs{display:flex;gap:6px;overflow-x:auto}
  .progress{padding-top:10px;margin-top:8px}
  .panel{grid-template-columns:1fr}
  .side-art{display:none}
  .hero svg{display:none}
}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>
</head>
<body>
<div class="app">
  <main><div class="wrap" id="view"></div></main>
  <aside>
    <div class="navs">
      <p class="label">Menu de onboarding</p>
      <ul class="nav" id="nav"></ul>
      <p class="label">Etapas do treinamento</p>
      <ul class="route" id="route"></ul>
    </div>
    <div class="progress">
      <div class="row"><span>Progresso</span><span id="pcount">0 / 0</span></div>
      <div class="bar"><i id="pbar"></i></div>
      <button class="reset" id="reset" type="button">Limpar meu progresso</button>
    </div>
  </aside>
</div>

  web:{ title:"Questionário da plataforma web", pass:0.7, qs:[
    {q:"Um cliente pede para excluir de vez um Local antigo que não usa mais. Qual a orientação?", o:["Excluir pelo ícone de lixeira na lista de Locais","Locais não podem ser excluídos; ele deve desativar o Local para manter o histórico","Pedir ao suporte a exclusão no banco de dados","Editar o Local e apagar o endereço"], a:1, e:"Por questão de histórico, o sistema só permite desativar um Local. Ele sai do mapa e da lista de ativos e pode ser reativado depois."},
    {q:"O gestor cadastrou uma nova oficina diretamente no módulo de Manutenção. O que acontece?", o:["Ela fica disponível só dentro da Manutenção","Ela é criada automaticamente como Local do tipo Oficina e aparece no mapa","É preciso cadastrar a mesma oficina de novo em Locais","Ela aparece no app do motorista como posto"], a:1, e:"A Manutenção usa a base de Locais: uma oficina nova cadastrada ali vira um Local automaticamente."},
    {q:"Quais Locais aparecem automaticamente no app do motorista na hora de registrar um abastecimento?", o:["Todos os Locais ativos","Os Locais do tipo Posto","Os Locais do tipo Empresa e Oficina","Nenhum; o motorista digita o nome do posto"], a:1, e:"Todos os Locais cadastrados com o tipo Posto aparecem no app durante o registro de abastecimento."},
    {q:"No Relatório de Rotas, uma rota aparece com motorista \"Não Identificado\". Como corrigir?", o:["Não é possível alterar o motorista de uma rota","Clicar no ícone do bonequinho na linha e vincular o motorista manualmente","Excluir a rota e pedir ao motorista para refazer o trajeto","Editar o cadastro do veículo"], a:1, e:"Pelo ícone do bonequinho, o gestor seleciona e vincula o motorista correto àquela rota."},
    {q:"O cliente quer o Relatório de Rotas de um veículo de janeiro a junho em uma única consulta. O que acontece?", o:["Funciona normalmente","O período máximo por consulta é de 3 meses; ele precisa dividir em duas consultas","O relatório só aceita 30 dias","Só é possível exportando em Excel"], a:1, e:"O Relatório de Rotas permite no máximo 3 meses por consulta."},
    {q:"Um veículo rodou numa área sem sinal de celular e as rotas só apareceram horas depois. O que explica isso?", o:["Falha no rastreador, que precisa ser trocado","O rastreador guardou os dados internamente (Data Logger) e enviou quando o sinal voltou","O sistema atualiza as rotas apenas uma vez por dia","O motorista desligou o rastreador"], a:1, e:"Em áreas de sombra, o rastreador armazena os pontos e descarrega tudo automaticamente quando o sinal é restabelecido."},
    {q:"Uma empresa quer gerir a frota fazendo identificação facial do motorista. O que você apresenta?", o:["Identificação pelo aplicativo do motorista","Identificação por câmera","Identificação via checklist com foto","Identificação via módulo de motorista"], a:1, e:"A identificação facial do motorista é feita pela câmera instalada no veículo."},
    {q:"O veículo com câmera ficou 20 minutos ligado e parado no pátio, e o motorista não foi identificado. O que você responde ao cliente?", o:["É um defeito na câmera e precisa de visita técnica","É esperado: a identificação facial depende do veículo em movimento, gerando pontos de atualização","A foto do motorista foi apagada após 90 dias","A câmera só identifica depois de 30 minutos de rota"], a:1, e:"Com o veículo ligado mas parado, a identificação não acontece. Nos primeiros 10 minutos de rota as tentativas são de 1 em 1 minuto."},
    {q:"O cliente quer detecção automática de fadiga, uso de celular e falta de cinto. Qual câmera atende?", o:["Cam ONE","Cam Plus","Cam Max","Qualquer uma das três"], a:2, e:"Os eventos com Inteligência Artificial são exclusivos da Cam Max."},
    {q:"Houve um sinistro ontem com um veículo que tem câmera. Qual a orientação mais importante sobre a gravação?", o:["Não há pressa, as gravações ficam guardadas por 90 dias","Solicitar o download logo, porque as gravações ficam disponíveis por até 10 dias","Esperar o veículo voltar para a empresa para tirar o cartão","Pedir a gravação ao suporte por e-mail"], a:1, e:"As gravações ficam armazenadas por até 10 dias, em trechos de 3 minutos. Depois disso podem ser sobrescritas."},
    {q:"Qual a diferença entre \"Baixar Playback Atual\" e \"Baixar Gravação da Câmera\"?", o:["Não há diferença","O playback salva só o trecho assistido no computador; a gravação da câmera baixa os 3 minutos completos, consome dados do chip e fica no Histórico de Downloads","O playback consome dados do chip e a gravação da câmera não","A gravação da câmera só funciona com o veículo desligado"], a:1, e:"Baixar gravação da câmera envia o arquivo completo pela rede móvel e fica registrado no Histórico de Downloads; o playback atual fica só no computador."},
    {q:"O gestor tem vários motoristas na lista de \"Não identificados\" da vídeo telemetria. Por quanto tempo ele consegue fazer o vínculo manual pelas fotos?", o:["7 dias","10 dias","90 dias","Sem limite"], a:2, e:"As fotos dos motoristas não identificados ficam disponíveis por 90 dias e depois são apagadas."},
    {q:"Um motorista usa óculos escuros para dirigir e quase nunca é reconhecido pela câmera. Qual a melhor orientação?", o:["Trocar o modelo da câmera","Cadastrar no perfil uma foto dele usando os óculos, com boa iluminação","Desativar a identificação facial desse motorista","Pedir que ele se identifique pelo checklist"], a:1, e:"Se o motorista dirige de óculos, incluir uma foto com o acessório melhora muito a precisão do reconhecimento."},
    {q:"A média real de consumo de um veículo não aparece. Qual a causa mais provável?", o:["O veículo não tem meta de km/L","Não há pelo menos dois abastecimentos de tanque completo consecutivos","Os abastecimentos foram lançados pelo web","O posto não está cadastrado em Locais"], a:1, e:"O sistema precisa de pelo menos dois abastecimentos completos consecutivos para calcular a média real."},
    {q:"O gestor lançou multas manualmente. Em que caso o sistema vincula o motorista sozinho?", o:["Sempre, pelo cadastro do veículo","Quando o motorista estava usando o app Contele Driver na data e hora da infração","Só quando a multa vem pela integração","Nunca; o vínculo é sempre manual"], a:1, e:"No modo manual, se o motorista estava identificado no app no horário da infração, o vínculo é automático."},
    {q:"Um cliente com toda a frota em nome de pessoa física (CPF) quer o desconto de 40% do SNE pela integração. O que você responde?", o:["Basta aderir ao SNE no portal do SENATRAN","O SENATRAN/SNE só funciona para veículos vinculados a CNPJ","Ele precisa contratar a Telemetria Avançada","O desconto de 40% vale para qualquer notificação"], a:1, e:"A integração com SENATRAN/SNE não é possível para veículos em CPF, somente CNPJ."},
    {q:"Depois de aderir ao SNE, o cliente pergunta se ainda precisa indicar o condutor. Qual a resposta?", o:["Não, o SNE elimina a indicação","Sim; se perder o prazo, a multa NIC pode dobrar o valor","Só se a multa for gravíssima","Só para veículos sem rastreador"], a:1, e:"A adesão ao SNE não elimina a indicação do condutor. Perder o prazo pode gerar a multa NIC, que dobra o valor."},
    {q:"Um gestor quer ser avisado 500 km antes da troca de óleo vencer. Onde ele configura isso?", o:["Em Eventos > KM atingido","Nas regras de alerta \"A vencer\" do Plano de Manutenção","No cadastro do item, em Itens de Manutenção","Em Relatórios > Km rodado"], a:1, e:"No Plano de Manutenção, o gestor define a antecedência do status \"A vencer\", por km ou por dias."},
    {q:"No checklist, como fazer com que a resposta \"Pneu careca\" gere uma ocorrência para o gestor?", o:["Não é possível; toda resposta gera ocorrência","Em Checklist > Configurações, marcar essa resposta como ocorrência","Pedir ao motorista que escreva nas observações","Criar uma manutenção corretiva"], a:1, e:"Em Checklist > Configurações o gestor define quais respostas específicas viram ocorrência e geram alerta."},
    {q:"No Ao Vivo, o gestor seleciona um veículo desligado. O que acontece?", o:["A transmissão não está disponível para veículos desligados","O sistema envia o comando para acordar a câmera e inicia a transmissão quando ela ativa","É preciso pedir ao motorista para ligar o veículo","Todos os canais começam a transmitir automaticamente"], a:1, e:"O sistema mostra \"Acordando o dispositivo...\" e envia o comando de despertar. Cada canal só transmite quando é clicado, para economizar dados."}

const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* ---------- render ---------- */
function header(emoji,title){
  return `<div class="top"><h1>${emoji} ${esc(title)}</h1><img class="brand-img" src="${LOGO}" alt="Contele Fleet"></div>`;
}
function pager(){
  const n=PAGES.length, i=state.page;
  return `<div class="pager"><span class="count">${i+1} / ${n}</span>
    <button class="prev" type="button" data-go="${i-1}" ${i===0?"disabled":""}>← Anterior</button>
    <button class="next" type="button" data-go="${i+1}" ${i===n-1?"disabled":""}>Próximo →</button></div>`;
}
function libHTML(lib){
  return `<div class="lib"><p class="gs">Os vídeos abrem no Google Drive e ficam marcados como assistidos ao clicar.</p>
    ${lib.map(g=>`<div><h4>${esc(g.who)} <span style="color:var(--muted);font-weight:500">· ${esc(g.role)}</span></h4><p class="gs">${esc(g.note)}</p>
      <div class="vids">${g.vids.map(v=>`<a class="vid${state.done["v-"+v.id]?" seen":""}" href="${D(v.id)}" target="_blank" rel="noopener" data-vid="v-${v.id}"><span class="dot"></span>${esc(v.label)}</a>`).join("")}</div></div>`).join("")}</div>`;
}
function itemHTML(it,lib){
  const done=!!state.done[it.id];
  let acts=(it.links||[]).map(l=>`<a class="btn" href="${esc(l.url)}" target="_blank" rel="noopener">▶ ${esc(l.label)}</a>`).join("");
  if(it.quiz){
    const r=state.quiz[it.quiz];
    acts+=`<button class="btn" type="button" data-quiz="${it.quiz}">${r?"Refazer questionário":"Responder questionário"}</button>`;
    if(r) acts+=`<span class="score ${r.passed?"ok":"no"}">${r.score}/${r.total} ${r.passed?"· aprovado":"· refazer"}</span>`;
  }
  const F=state.final;
  if(it.final&&F&&F.passed){acts+=`<button class="btn" type="button" data-open="cert">Baixar certificado</button><button class="btn ghost" type="button" data-open="final">Refazer</button><span class="score ok">Nota ${F.score} · aprovado</span>`;}
  else if(it.open){acts+=`<button class="btn" type="button" data-open="${it.open}">${esc(it.openLabel)}</button>`;}
  if(it.pending) acts+=`<span class="pending">Aguardando: ${esc(it.pending)}</span>`;
  if(it.info==="mail") acts+=`<span class="info">Enviar vídeo e feedback para Produto pelo e-mail: <a href="mailto:${PRODUTO_EMAIL}">${PRODUTO_EMAIL}</a></span>`;
  const wide=it.withLibrary&&lib;
  return `<div class="item${done?" done":""}${wide?" wide":""}">
    <h3>${esc(it.title)}</h3><p>${esc(it.desc)}</p>
    <div class="actions">${acts}
      <label class="check"><input type="checkbox" data-id="${it.id}" ${done?"checked":""}> Concluído</label></div>${wide?libHTML(lib):""}</div>`;
}

    <div class="stats"><div><b>7</b>dias</div><div><b>${vids}</b>reuniões gravadas</div><div><b>${total}</b>atividades</div></div>
    <button class="btn" type="button" data-go="2" style="margin-top:22px;background:var(--amber);color:#1B1300">Começar pela Fase 1</button>
    <svg viewBox="0 0 400 220" aria-hidden="true"><path d="M10 200 C 120 200, 110 90, 220 100 S 330 30, 390 20" fill="none" stroke="#2A3B55" stroke-width="18" stroke-linecap="round"/><path d="M10 200 C 120 200, 110 90, 220 100 S 330 30, 390 20" fill="none" stroke="#F2A900" stroke-width="3" stroke-dasharray="14 12" stroke-linecap="round"/>${[[10,200],[118,150],[220,100],[310,58],[390,20]].map(([x,y],k)=>`<circle cx="${x}" cy="${y}" r="11" fill="${k===4?"#F2A900":"#0F1B2D"}" stroke="#F2A900" stroke-width="3"/>`).join("")}</svg>
  </section>`+pager();
}
function renderCrono(){
  return header("⏳","Cronologia")+`<div class="card"><span class="tag" style="color:var(--blue);background:var(--blue-soft)">Calendário</span>
  <h2>Sua rota em 7 dias</h2><p class="lead">Cada parada da rota corresponde a uma fase do treinamento.</p>
  <ol class="timeline">${TIMELINE.map(([d,t,p],k)=>`<li><span class="pin"></span><div class="days">${d}</div><h3><button class="btn ghost" type="button" data-go="${k+2}" style="padding:4px 10px;font-size:15px;font-family:Archivo,sans-serif">${esc(t)}</button></h3><p>${esc(p)}</p></li>`).join("")}</ol></div>`+pager();
}
function renderPhase(p){
  const creds=p.notice&&p.notice.creds?`<div class="creds">${p.notice.creds.map(([k,v,u])=>`<div class="cred"><small>${esc(k)}</small>${u?`<a href="${esc(u)}" target="_blank" rel="noopener">${esc(v)}</a>`:`<code>${esc(v)}</code>`}</div>`).join("")}</div>`:"";
  const notice=p.notice?`<div class="notice"><span style="font-size:22px">${p.key==="f5"?"⚠️":"🔑"}</span><div style="flex:1;min-width:0"><strong>${esc(p.notice.title)}</strong>${esc(p.notice.text)}${creds}</div></div>`:"";
  return header(p.emoji,p.title)+`<div class="panel"><div class="card">
    <span class="tag" style="color:${p.tagColor};background:${p.tagBg}">${esc(p.tag)}</span>
    <h2>${esc(p.h2)}</h2><p class="lead">${esc(p.lead)}</p>
    ${notice}<div class="grid">${p.items.map(it=>itemHTML(it,p.library)).join("")}</div>
  </div><div class="side-art" style="background:${p.art.bg}"><div class="ico">${p.art.icon}</div><strong style="color:${p.art.color}">${esc(p.art.label)}</strong></div></div>`+pager();
}
function renderSide(){
  document.getElementById("nav").innerHTML=[["🏠","Início",0],["⏳","Cronologia",1]].map(([e,l,i])=>`<li><button type="button" data-go="${i}" class="${state.page===i?"active":""}">${e} ${l}</button></li>`).join("");
  document.getElementById("route").innerHTML=PHASES.map((p,k)=>{
    const ids=phaseIds(p), full=ids.length&&ids.every(id=>state.done[id]);
    return `<li><button type="button" data-go="${k+2}" class="${state.page===k+2?"active":""}"><span class="stop${full?" full":""}">${full?"✓":p.emoji}</span><span class="meta">${esc(p.nav)}<small>${esc(p.sub)}</small></span></button></li>`;}).join("");
  const ids=allTrackable(), d=ids.filter(id=>state.done[id]).length;
  document.getElementById("pcount").textContent=d+" / "+ids.length;
  document.getElementById("pbar").style.width=(ids.length?d/ids.length*100:0)+"%";
}
function render(){
  const p=PAGES[state.page];
  document.getElementById("view").innerHTML = p.key==="inicio"?renderInicio(): p.key==="crono"?renderCrono(): renderPhase(p);
  renderSide();
}

/* ---------- modais ---------- */
const overlay=document.getElementById("overlay"), modal=document.getElementById("modal");
let lastFocus=null;
function openModal(html){lastFocus=document.activeElement; modal.innerHTML=`<button class="x" type="button" data-close aria-label="Fechar">×</button>`+html; overlay.classList.add("open"); modal.querySelector(".x").focus();}
function closeModal(){overlay.classList.remove("open"); modal.innerHTML=""; render(); if(lastFocus&&document.contains(lastFocus)) lastFocus.focus();}

let QORD={};
function quizHTML(key){
  const Q=QUIZZES[key];
  QORD[key]=Q.qs.map(q=>q.o.map((_,j)=>j).sort(()=>Math.random()-.5));
  return `<h2>${esc(Q.title)}</h2><p class="lead" style="margin-bottom:6px">Responda todas as perguntas e clique em Corrigir. Aprovação com ${Math.round(Q.pass*100)}% de acerto.</p>
  <div id="quizbox" data-key="${key}">${Q.qs.map((q,i)=>`<fieldset class="q" data-i="${i}"><legend>${i+1}. ${esc(q.q)}</legend>
    ${QORD[key][i].map(j=>`<label><input type="radio" name="q${i}" value="${j}"> <span>${esc(q.o[j])}</span></label>`).join("")}
    <div class="fb"></div></fieldset>`).join("")}</div>
  <div id="quizres"></div>
  <div class="pager" style="margin-top:12px"><button class="next" type="button" data-grade="${key}">Corrigir</button></div>`;
}
function grade(key){
  const Q=QUIZZES[key]; let score=0, missing=0;
  Q.qs.forEach((q,i)=>{
    const fs=modal.querySelector(`fieldset[data-i="${i}"]`), sel=fs.querySelector("input:checked");
    fs.classList.remove("right","wrong");
    if(!sel){missing++; return;}
    const ok=+sel.value===q.a; if(ok) score++;
    fs.classList.add(ok?"right":"wrong");
    fs.querySelector(".fb").textContent=(ok?"Correto. ":"Resposta certa: "+q.o[q.a]+". ")+q.e;
  });
  const res=modal.querySelector("#quizres");
  if(missing){res.innerHTML=`<div class="result no">Faltam ${missing} pergunta(s) sem resposta.</div>`; return;}
  const passed=score/Q.qs.length>=Q.pass;
  state.quiz[key]={score,total:Q.qs.length,passed};
  const itemId=key==="web"?"f3-quest":"f4-quest";
  if(passed) state.done[itemId]=true;
  save();
  res.innerHTML=`<div class="result ${passed?"ok":"no"}">Você acertou ${score} de ${Q.qs.length}. ${passed?"Aprovado! O questionário foi marcado como concluído.":"Revise os módulos na Central de Ajuda e tente de novo."}</div>`;
  res.scrollIntoView({behavior:"smooth",block:"nearest"});
}
function roteiroHTML(){
  const n=state.notes;
  return `<h2>Roteiro da avaliação final</h2>
  <p class="lead">Apresentação simulada de onboarding para um cliente fictício, conduzida pelo novo consultor e avaliada pelo CS mais experiente e por Produto.</p>
  <h3 style="font-size:16px">Como funciona</h3>
  <ol class="steps">
    <li><b>Cenário:</b> o avaliador interpreta um cliente com uma frota de 20 a 50 veículos e duas ou três dores (por exemplo, custo de combustível, multas e manutenção atrasada).</li>
    <li><b>Duração:</b> de 30 a 45 minutos, com a reunião gravada.</li>
    <li><b>Conteúdo:</b> diagnóstico, demonstração da plataforma web, demonstração do app do gestor e do Contele Fleet Driver, dúvidas e próximos passos.</li>
    <li><b>Notas:</b> de 0 a 10 por critério. Aprovação com todas as notas iguais ou acima de 7,0.</li>
    <li><b>Envio:</b> gravação e feedback para Produto em <a href="mailto:${PRODUTO_EMAIL}">${PRODUTO_EMAIL}</a>.</li>
  </ol>
  <h3 style="font-size:16px;margin-top:18px">Critérios</h3>
  <div class="tablewrap"><table class="crit"><thead><tr><th>Critério</th><th>O que observar</th><th>Nota</th></tr></thead><tbody>
  ${CRITERIA.map(([c,d],i)=>`<tr><td><b>${esc(c)}</b></td><td>${esc(d)}</td><td><input type="number" min="0" max="10" step="0.5" data-note="${i}" value="${n[i]??""}" aria-label="Nota ${esc(c)}"></td></tr>`).join("")}
  </tbody></table></div>
  <div id="notesres"></div>`;
}
function notesResult(){
  const vals=CRITERIA.map((_,i)=>state.notes[i]).filter(v=>v!==undefined&&v!=="");
  const box=modal.querySelector("#notesres"); if(!box) return;
  if(vals.length<CRITERIA.length){box.innerHTML=`<div class="result no" style="background:var(--bg);color:var(--muted)">${vals.length} de ${CRITERIA.length} critérios avaliados.</div>`; return;}
  const nums=vals.map(Number), min=Math.min(...nums), avg=nums.reduce((a,b)=>a+b,0)/nums.length, ok=min>=7;
  box.innerHTML=`<div class="result ${ok?"ok":"no"}">Média ${avg.toFixed(1)} · menor nota ${min.toFixed(1)} · ${ok?"Aprovado":"Não aprovado: há nota abaixo de 7,0"}</div>`;
}
let FX=null; // sessão da avaliação final
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function finalStartHTML(){
  const nm=(state.final&&state.final.name)||"";
  const [first,...rest]=nm.split(" ");
  return `<span class="tag" style="color:var(--red);background:var(--red-soft)">Avaliação final</span>
  <h2>Avaliação de Customer Success do Contele Fleet</h2>
  <p class="lead">São 13 questões, uma por módulo, com três alternativas cada. A nota mínima para aprovação é 8,0 (11 acertos). Preencha seus dados para começar.</p>
  <div class="certform"><input id="fx-first" placeholder="Seu nome" value="${esc(first||"")}"><input id="fx-last" placeholder="Seu sobrenome" value="${esc(rest.join(" "))}"></div>
  <p id="fx-err" class="pending" style="display:none;margin-top:10px">Preencha nome e sobrenome.</p>
  <div class="pager" style="margin-top:16px"><button class="next" type="button" data-fx="start">Iniciar avaliação</button></div>`;
}
function finalQHTML(){
  const k=FX.i, q=FX.qs[k], sel=FX.ans[k];
  const chips=FX.qs.map((_,n)=>`<button type="button" class="fxchip${n===k?" cur":""}${FX.ans[n]!=null?" ans":""}" data-fxgo="${n}" ${n>k&&FX.ans[n]==null&&FX.ans[n-1]==null?"disabled":""}>${n+1}</button>`).join("");
  const last=k===FX.qs.length-1;
  return `<div class="fxchips">${chips}</div>
  <div style="display:flex;gap:10px;align-items:center;margin:14px 0 8px"><span class="tag" style="margin:0;color:var(--blue);background:var(--blue-soft)">Módulo ${esc(q.m)}</span><span style="color:var(--muted);font-size:13.5px">Questão ${k+1} de ${FX.qs.length}</span></div>
  <h3 style="font-size:clamp(18px,2.4vw,22px);line-height:1.35;margin-bottom:14px">${esc(q.q)}</h3>
  ${q.opts.map((o,n)=>`<button type="button" class="fxopt${sel===n?" sel":""}" data-fxopt="${n}"><span class="r"></span><span>${esc(o.t)}</span></button>`).join("")}
  <div class="pager" style="margin-top:16px">
    <button class="prev" type="button" data-fx="prev">← Voltar</button>
    <button class="next" type="button" data-fx="${last?"finish":"next"}" ${sel==null?"disabled":""}>${last?"Finalizar avaliação":"Próximo →"}</button>
  </div>`;
}
function finalResultHTML(){
  const F=state.final, first=F.name.split(" ")[0];
  return `<div style="text-align:center;padding:10px 0">
    <h2 style="font-size:36px;color:${F.passed?"var(--green)":"var(--red)"}">${F.passed?"Parabéns, aprovado!":"Reprovado"}</h2>
    <p class="lead" style="margin:8px auto 20px">${F.passed?esc(first)+", você demonstrou excelente domínio da plataforma.":"A nota mínima exigida é 8,0. Revise os módulos na Central de Ajuda e tente novamente."}</p>
    <div style="display:flex;justify-content:center;gap:40px;background:var(--bg);border-radius:16px;padding:20px">
      <div><div style="font:800 52px Archivo,sans-serif;color:${F.passed?"var(--green)":"var(--red)"}">${F.score}</div><small style="color:var(--muted);font-weight:700">SUA NOTA</small></div>
      <div><div style="font:700 40px Archivo,sans-serif;margin-top:8px">${F.correct}/${F.total}</div><small style="color:var(--muted);font-weight:700">ACERTOS</small></div>
    </div>
    <div class="pager" style="justify-content:center;margin-top:20px">${F.passed?`<button class="next" type="button" data-open="cert">Baixar certificado em PDF</button>`:`<button class="next" type="button" data-fx="restart">Tentar novamente</button>`}</div>
  </div>`;
}
function startFinal(){
  const a=modal.querySelector("#fx-first").value.trim(), b=modal.querySelector("#fx-last").value.trim();
  if(!a||!b){modal.querySelector("#fx-err").style.display="inline-block";return;}
  FX={name:a+" "+b, i:0, ans:FINAL.map(()=>null), qs:FINAL.map(q=>({m:q.m,q:q.q,opts:shuffle([{t:q.c,ok:true},{t:q.w[0],ok:false},{t:q.w[1],ok:false}])}))};
  modal.innerHTML=closeBtn()+finalQHTML();
}
function finishFinal(){
  const miss=FX.ans.indexOf(null);
  if(miss>-1){FX.i=miss;modal.innerHTML=closeBtn()+finalQHTML();return;}
  const correct=FX.qs.filter((q,k)=>q.opts[FX.ans[k]].ok).length, total=FX.qs.length;
  const score=(correct/total*10).toFixed(1), passed=+score>=FINAL_PASS;
  state.final={name:FX.name, score, correct, total, passed, date:new Date().toLocaleDateString("pt-BR"),
    answers:FX.qs.map((q,k)=>({q:q.q, t:q.opts[FX.ans[k]].t, ok:q.opts[FX.ans[k]].ok}))};
  if(passed){state.done["f5-final"]=true; state.cert.name=FX.name;}
  save(); FX=null;
  modal.innerHTML=closeBtn()+finalResultHTML();
}
const closeBtn=()=>`<button class="x" type="button" data-close aria-label="Fechar">×</button>`;
function certHTML(){
  const F=state.final;
  if(!F||!F.passed) return `<h2>Certificado bloqueado</h2><p class="lead">O certificado é liberado depois da aprovação na avaliação final de certificação (nota mínima 8,0).</p><div class="pager"><button class="next" type="button" data-open="final">Ir para a avaliação final</button></div>`;
  return `<h2>Certificado</h2><p class="lead">Clique em Imprimir e escolha "Salvar como PDF". A segunda página traz o gabarito das suas respostas.</p>
  <div id="cert-print">
    <div class="ccert">
      <div class="b1"></div><div class="b2"></div>
      <img class="logo-img" src="${LOGO}" alt="Contele Fleet">
      <h3>Certificado de Conclusão</h3>
      <p class="txt">Certificamos que <strong>${esc(F.name)}</strong> concluiu a avaliação de Customer Success do Contele Fleet, demonstrando elevado conhecimento nos módulos operacionais e de gestão.</p>
      <div class="sc"><div><small>Nota alcançada</small><b>${F.score}</b></div><i></i><div><small>Aproveitamento</small><b style="color:#10B981">Aprovado</b></div></div>
      <div class="ft"><b>Equipe de Customer Success - Contele Fleet</b><span>${esc(F.date)}</span></div>
    </div>
    <div class="cgab">
      <h3>Gabarito da Avaliação</h3><p>Revisão das respostas fornecidas pelo aluno</p>
      <div class="gg">${F.answers.map((a,k)=>`<div class="${a.ok?"ok":"no"}"><b>${k+1}. ${esc(a.q)}</b><span><em>${a.ok?"✓":"✗"}</em> ${esc(a.t)}</span></div>`).join("")}</div>
    </div>
  </div>
  <div class="pager" style="margin-top:14px"><button class="next" type="button" data-print>Imprimir / salvar PDF</button></div>`;
}

/* ---------- eventos ---------- */
document.addEventListener("click",e=>{
  if(e.target===overlay||e.target.closest("[data-close]")){ askClose(); return;}
  if(e.target.closest("[data-leave]")){FX=null;closeModal();return;}
  if(e.target.closest("[data-stay]")){modal.innerHTML=closeBtn()+finalQHTML();return;}
  const g=e.target.closest("[data-go]");
  if(g){const n=+g.dataset.go; if(n>=0&&n<PAGES.length){state.page=n;save();render();document.querySelector("main").scrollTop=0;} return;}
  const v=e.target.closest("[data-vid]");
  if(v){state.done[v.dataset.vid]=true;save();setTimeout(render,50);return;}
  const q=e.target.closest("[data-quiz]"); if(q){openModal(quizHTML(q.dataset.quiz));return;}
  const gr=e.target.closest("[data-grade]"); if(gr){grade(gr.dataset.grade);return;}
  const o=e.target.closest("[data-open]");
  if(o){ const w=o.dataset.open; const inModal=overlay.classList.contains("open");
    const html = w==="roteiro"?roteiroHTML(): w==="final"?finalStartHTML(): certHTML();
    if(inModal) modal.innerHTML=closeBtn()+html; else openModal(html);
    if(w==="roteiro") notesResult(); return;}
  const fx=e.target.closest("[data-fx]");
  if(fx){const a=fx.dataset.fx;
    if(a==="start") startFinal();
    else if(a==="restart") modal.innerHTML=closeBtn()+finalStartHTML();
    else if(a==="prev"&&FX){ if(FX.i===0){FX=null;modal.innerHTML=closeBtn()+finalStartHTML();} else {FX.i--;modal.innerHTML=closeBtn()+finalQHTML();} }
    else if(a==="next"&&FX){FX.i++;modal.innerHTML=closeBtn()+finalQHTML();}
    else if(a==="finish"&&FX) finishFinal();
    return;}
  const fo=e.target.closest("[data-fxopt]"); if(fo&&FX){FX.ans[FX.i]=+fo.dataset.fxopt;modal.innerHTML=closeBtn()+finalQHTML();return;}
  const fg=e.target.closest("[data-fxgo]"); if(fg&&FX){FX.i=+fg.dataset.fxgo;modal.innerHTML=closeBtn()+finalQHTML();return;}
  if(e.target.closest("[data-print]")){try{window.print();}catch(err){}}
});
document.addEventListener("change",e=>{
  if(e.target.matches("input[data-id]")){state.done[e.target.dataset.id]=e.target.checked;save();render();}
});
document.addEventListener("input",e=>{
  const t=e.target;
  if(t.matches("[data-note]")){const v=t.value; if(v==="") delete state.notes[t.dataset.note]; else state.notes[t.dataset.note]=Math.max(0,Math.min(10,+v)); save(); notesResult();}
});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&overlay.classList.contains("open")) askClose();});
function askClose(){
  if(FX&&FX.ans.some(a=>a!=null)){
    modal.innerHTML=`<h2>Sair da avaliação?</h2><p class="lead">As respostas desta tentativa serão perdidas.</p>
    <div class="pager" style="justify-content:flex-start"><button class="prev" type="button" data-stay>Continuar avaliação</button><button class="next" type="button" data-leave>Sair</button></div>`;
    return;
  }
  FX=null; closeModal();
}
document.getElementById("reset").addEventListener("click",e=>{
  const b=e.currentTarget;
  if(!b.dataset.armed){b.dataset.armed="1";b.textContent="Clique de novo para confirmar";setTimeout(()=>{delete b.dataset.armed;b.textContent="Limpar meu progresso";},4000);return;}
  delete b.dataset.armed;b.textContent="Limpar meu progresso";
  state.done={};state.quiz={};state.notes={};state.cert={};state.final=null;save();render();
});
render();
</script>
</body>
</html>
